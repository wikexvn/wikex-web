<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikex — Pitch Deck</title>
<meta name="description" content="Pitch Deck Wikex Commodities — Đón đầu xu thế, dẫn đầu cơ hội. Thành viên Kinh doanh 090 của Sở Giao dịch Hàng hóa Việt Nam (MXV).">
<meta property="og:title" content="Wikex — Pitch Deck (Đón đầu xu thế, dẫn đầu cơ hội)">
<meta property="og:description" content="Giới thiệu Wikex Commodities — Thành viên Kinh doanh MXV.">
<meta property="og:image" content="https://wikexvn.github.io/wikex-web/pitch-deck/slides/slide-01.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{--gold:#d4af37;--bg:#0b0b0d;--panel:#15151a;--line:#2a2a33}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#fff;overflow-x:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,11,13,.9);backdrop-filter:blur(8px);z-index:10}
  .brand{font-weight:800;font-size:20px;letter-spacing:.5px}
  .brand span{color:var(--gold)}
  .brand small{display:block;font-size:11px;font-weight:500;color:#9aa0a6;letter-spacing:1px}
  header .meta{font-size:12px;color:#9aa0a6;text-align:right}
  .stage{max-width:1180px;margin:0 auto;padding:22px 16px 10px}
  .frame{position:relative;background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .frame img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000}
  .nav{position:absolute;top:0;bottom:0;width:18%;cursor:pointer;display:flex;align-items:center;border:0;background:transparent;color:#fff;opacity:0;transition:opacity .15s}
  .frame:hover .nav{opacity:1}
  .nav.prev{left:0;justify-content:flex-start;padding-left:14px;background:linear-gradient(90deg,rgba(0,0,0,.4),transparent)}
  .nav.next{right:0;justify-content:flex-end;padding-right:14px;background:linear-gradient(270deg,rgba(0,0,0,.4),transparent)}
  .nav svg{width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
  .controls{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px;flex-wrap:wrap}
  .controls button{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .controls button:hover{border-color:var(--gold);color:var(--gold)}
  .counter{font-variant-numeric:tabular-nums;font-size:15px;color:#cfd3d7;min-width:70px;text-align:center}
  .counter b{color:var(--gold)}
  .thumbs{max-width:1180px;margin:0 auto;padding:6px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .thumbs img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px;border:2px solid transparent;cursor:pointer;opacity:.55;transition:.15s}
  .thumbs img:hover{opacity:.85}
  .thumbs img.active{border-color:var(--gold);opacity:1}
  footer{border-top:1px solid var(--line);padding:22px 16px;text-align:center;color:#9aa0a6;font-size:13px}
  footer a{color:var(--gold);text-decoration:none}
  :fullscreen .frame{border-radius:0;height:100vh}
  :fullscreen .frame img{height:100vh;aspect-ratio:auto}
</style>
</head>
<body>
<header>
  <div class="brand">WI<span>KEX</span><small>PITCH DECK</small></div>
  <div class="meta">Đón đầu xu thế · Dẫn đầu cơ hội<br>Thành viên Kinh doanh 090 — MXV · 0823 968 319</div>
</header>
<div class="stage">
  <div class="frame" id="frame">
    <img id="slide" src="slides/slide-01.jpg" alt="Slide 1">
    <button class="nav prev" id="prev" aria-label="Trước"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="nav next" id="next" aria-label="Sau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div class="controls">
    <button id="bprev">‹ Trước</button>
    <span class="counter"><b id="cur">1</b> / <span id="total">37</span></span>
    <button id="bnext">Sau ›</button>
    <button id="bfs">⛶ Toàn màn hình</button>
  </div>
</div>
<div class="thumbs" id="thumbs"></div>
<footer>
  © 2026 Công ty Cổ phần Giao dịch Hàng hóa Wikex · Thành viên Kinh doanh MXV<br>
  136 Hồ Tùng Mậu, Hà Nội · <a href="tel:0823968319">0823 968 319</a> · <a href="../">Trang chủ Wikex</a>
</footer>
<script>
  var N=37, i=1;
  var pad=function(n){return (n<10?'0':'')+n;};
  var src=function(n){return 'slides/slide-'+pad(n)+'.jpg';};
  var slide=document.getElementById('slide'), cur=document.getElementById('cur'), thumbs=document.getElementById('thumbs');
  document.getElementById('total').textContent=N;
  for(var k=1;k<=N;k++){(function(k){
    var t=document.createElement('img'); t.src=src(k); t.loading='lazy'; t.dataset.n=k; t.alt='Slide '+k;
    t.onclick=function(){go(k);}; thumbs.appendChild(t);
  })(k);}
  function go(n){
    if(n<1)n=N; if(n>N)n=1; i=n;
    slide.src=src(i); slide.alt='Slide '+i; cur.textContent=i;
    var ts=thumbs.children;
    for(var k=0;k<ts.length;k++) ts[k].classList.toggle('active', (+ts[k].dataset.n)===i);
    var act=thumbs.querySelector('img.active'); if(act) act.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  document.getElementById('prev').onclick=document.getElementById('bprev').onclick=function(){go(i-1);};
  document.getElementById('next').onclick=document.getElementById('bnext').onclick=function(){go(i+1);};
  document.getElementById('bfs').onclick=function(){
    var f=document.getElementById('frame');
    if(!document.fullscreenElement){ (f.requestFullscreen||f.webkitRequestFullscreen).call(f); }
    else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  };
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' ') go(i+1);
    else if(e.key==='ArrowLeft') go(i-1);
  });
  var x0=null;
  slide.parentNode.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
  slide.parentNode.addEventListener('touchend',function(e){
    if(x0===null)return; var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>40){ go(dx<0?i+1:i-1); } x0=null;
  },{passive:true});
  go(1);
</script>
</body>
</html>
